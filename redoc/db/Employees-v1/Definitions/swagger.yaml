openapi: 3.0.1
info:
  title: Employees
  description: Employés de l'UCL (source SAP HR)
  contact: {}
  version: v1
servers:
 -
  url: https://gateway-dev.api.uclouvain.be/qfmt/employees/v1.0
 -
  url: https://gateway.api.uclouvain.be/qfmt/employees/v1.0
security:
 -
  default: []
paths:
  /lists/emails:
    get:
      tags:
       - Lists
      summary: liste d'adresses email suivant critères
      parameters:
       -
        name: category_id
        in: query
        description: type de population (from/digit/v1/md/groups)
        required: false
        style: form
        explode: true
        schema:
          type: string
       -
        name: group_id
        in: query
        description: group_id (from/digit/v1/md/groups)
        required: false
        style: form
        explode: true
        schema:
          type: string
       -
        name: idms_list
        in: query
        description: numéros IDM séparés par une virgule
        required: false
        style: form
        explode: true
        schema:
          type: string
       -
        name: site_id
        in: query
        description: code du site
        required: false
        style: form
        explode: true
        schema:
          type: string
          enum:
           - Ch
           - Na
           - SG
           - To
           - LN
           - Mi
           - Mo
           - Wo
           - SL
           - MH
       -
        name: build_id
        in: query
        description: code du bâtiment
        required: false
        style: form
        explode: true
        schema:
          type: string
       -
        name: wing_id
        in: query
        description: aile du bâtiment (si build_id fourni)
        required: false
        style: form
        explode: true
        schema:
          type: string
       -
        name: acronym
        in: query
        description: sigle d'entité
        required: false
        style: form
        explode: true
        schema:
          type: string
       -
        name: addBudgetaire
        in: query
        description: "si =1 : ajoute les rattachements budgétaires"
        required: false
        style: form
        explode: true
        schema:
          type: string
       -
        name: affectation
        in: query
        description: "si =1 : ne prend que les affectations"
        required: false
        style: form
        explode: true
        schema:
          type: string
       -
        name: enseignant
        in: query
        description: année académique d'enseignement
        required: false
        style: form
        explode: true
        schema:
          type: string
       -
        name: accept
        in: query
        description: "format de sortie (json, xml, plain)"
        required: false
        style: form
        explode: true
        schema:
          type: string
          default: plain
      responses:
        "200":
          description: ""
          content: {}
        "400":
          description: Invalid acronym supplied
          content: {}
        "500":
          description: Validation error
          content: {}
      security:
       -
        default: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
      x-throttling-limit:
        requestCount: -1
        unit: MINUTE
      x-wso2-application-security:
        security-types:
         - oauth2
        optional: false
  /lists:
    get:
      tags:
       - Lists
      summary: liste de personnes suivant critères
      description: |
        "Onglet Documentation (onglet persons) documente le format des résultats"
      parameters:
       -
        name: matric_sap
        in: query
        description: matricule SAP
        required: false
        style: form
        explode: true
        schema:
          type: string
       -
        name: firstname
        in: query
        description: prénom
        required: false
        style: form
        explode: true
        schema:
          type: string
       -
        name: lastname
        in: query
        description: nom
        required: false
        style: form
        explode: true
        schema:
          type: string
       -
        name: acronym
        in: query
        description: sigle d'entité
        required: false
        style: form
        explode: true
        schema:
          type: string
       -
        name: directory
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: string
       -
        name: idms_list
        in: query
        description: numéros IDM séparés par une virgule
        required: false
        style: form
        explode: true
        schema:
          type: string
       -
        name: group_id
        in: query
        description: group_id (from /groups)
        required: false
        style: form
        explode: true
        schema:
          type: string
       -
        name: enseignant
        in: query
        description: année académique d'enseignement
        required: false
        style: form
        explode: true
        schema:
          type: string
       -
        name: site_id
        in: query
        description: code du site
        required: false
        style: form
        explode: true
        schema:
          type: string
          enum:
           - Ch
           - Na
           - SG
           - To
           - LN
           - Mi
           - Mo
           - Wo
           - SL
           - MH
       -
        name: build_id
        in: query
        description: code du bâtiment
        required: false
        style: form
        explode: true
        schema:
          type: string
       -
        name: wing_id
        in: query
        description: aile du bâtiment (si build_id fourni)
        required: false
        style: form
        explode: true
        schema:
          type: string
       -
        name: extension
        in: query
        description: extension téléphonique (5 chiffres)
        required: false
        style: form
        explode: true
        schema:
          type: string
       -
        name: page
        in: query
        description: numéro de page
        required: true
        style: form
        explode: true
        schema:
          type: string
          default: "1"
       -
        name: pageSize
        in: query
        description: nombre de personnes par page
        required: true
        style: form
        explode: true
        schema:
          type: string
          default: "5"
      responses:
        "200":
          description: ""
          headers:
            X-Pagination-Limit:
              description: Number of people by page
              style: simple
              explode: false
              schema:
                type: integer
            X-Pagination-Count:
              description: Number of people in request
              style: simple
              explode: false
              schema:
                type: integer
            X-Pagination-Page:
              description: Page number
              style: simple
              explode: false
              schema:
                type: integer
          content: {}
        "400":
          description: Invalid acronym supplied
          content: {}
        "500":
          description: Validation error
          content: {}
      security:
       -
        default: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
      x-throttling-limit:
        requestCount: -1
        unit: MINUTE
      x-wso2-application-security:
        security-types:
         - oauth2
        optional: false
